<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RootBridge — Learn Your Language, Discover Your Culture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF1E2;
    --bg-soft: #F1E3C9;
    --paper: #FFFDF8;
    --ink: #241A12;
    --ink-soft: #7A695A;
    --ink-faint: #B3A392;
    --gold: #E2A130;
    --gold-deep: #B87A1C;
    --gold-soft: #FBEBCB;
    --terracotta: #C15B3C;
    --terracotta-soft: #F5DED4;
    --green: #2E6B4C;
    --green-soft: #DCEBE1;
    --indigo: #332B5C;
    --indigo-soft: #E7E3F3;
    --indigo-deep: #221C42;
    --line: #E8DAC0;
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 11px;
    --font-display: 'Baloo 2', sans-serif;
    --font-serif: 'Fraunces', serif;
    --font-body: 'Inter', sans-serif;
    --shadow-card: 0 1px 2px rgba(36,26,18,0.04), 0 8px 24px -8px rgba(36,26,18,0.14);
    --shadow-pop: 0 2px 4px rgba(36,26,18,0.06), 0 16px 40px -12px rgba(36,26,18,0.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:
      radial-gradient(1200px 500px at 100% -10%, var(--gold-soft) 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}
  ::selection{background:var(--gold);color:var(--ink);}
  :focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:6px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

  /* ---------- prototype chrome ---------- */
  .rail{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:14px;
    padding:10px 18px;
    background:var(--indigo-deep); color:#EFE9FB;
    font-family:var(--font-body); font-size:13px;
  }
  .rail-brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em;white-space:nowrap;}
  .rail-brand .mark{width:20px;height:20px;}
  .rail select{
    background:#3C3369;color:#fff;border:1px solid #4E4482;border-radius:8px;
    padding:6px 10px;font-size:12.5px;
  }
  .rail .frame-toggle{display:flex;gap:4px;margin-left:auto;}
  .rail .frame-toggle button{
    background:transparent;border:1px solid #4E4482;color:#C9C0EA;border-radius:7px;
    padding:5px 10px;font-size:12px;font-weight:600;
  }
  .rail .frame-toggle button.active{background:var(--gold);border-color:var(--gold);color:#241A12;}
  .rail .journey{color:#9E93CC;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .stage{ display:flex; justify-content:center; padding:28px 16px 60px; }
  .frame-wrap{
    width:100%; max-width:1240px;
    container-type: inline-size;
    transition:max-width .25s ease;
  }
  .frame-wrap.tablet{max-width:834px;}
  .frame-wrap.mobile{max-width:414px;}
  .frame-wrap.tablet, .frame-wrap.mobile{
    border:10px solid var(--ink); border-radius:34px; padding:2px; background:var(--ink);
    box-shadow:var(--shadow-pop);
  }
  .frame-wrap.tablet #app, .frame-wrap.mobile #app{border-radius:26px; overflow:hidden;}

  #app{ background:var(--paper); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-card); }
  .frame-wrap.desktop #app{ box-shadow:none; background:transparent; }

  /* ---------- shared bits ---------- */
  .sankofa{display:inline-block;}
  .stamp{
    width:56px;height:56px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:2px dashed currentColor;
    position:relative;
    font-family:var(--font-display);
  }
  .stamp::before{
    content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid currentColor;opacity:.35;
  }
  .btn{
    font-family:var(--font-display); font-weight:600; font-size:15px;
    border-radius:999px; border:none; padding:13px 26px;
    display:inline-flex; align-items:center; gap:8px; justify-content:center;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--gold); color:#2B1B05; box-shadow:0 6px 0 var(--gold-deep);}
  .btn-primary:hover{filter:brightness(1.03);}
  .btn-primary:active{box-shadow:0 2px 0 var(--gold-deep); transform:translateY(4px) scale(.99);}
  .btn-dark{background:var(--indigo); color:#fff; box-shadow:0 6px 0 var(--indigo-deep);}
  .btn-dark:active{box-shadow:0 2px 0 var(--indigo-deep); transform:translateY(4px) scale(.99);}
  .btn-green{background:var(--green); color:#fff; box-shadow:0 6px 0 #1E4A34;}
  .btn-green:active{box-shadow:0 2px 0 #1E4A34; transform:translateY(4px) scale(.99);}
  .btn-ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none;}
  .btn-ghost:hover{border-color:var(--ink-faint);}
  .btn-sm{padding:9px 16px;font-size:13.5px;}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.4; pointer-events:none;}

  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:700;font-family:var(--font-display);}
  .h-display{font-family:var(--font-display);font-weight:700;}
  .h-serif{font-family:var(--font-serif);font-weight:600;}

  .progress-track{height:10px;border-radius:999px;background:var(--bg-soft);overflow:hidden;}
  .progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--terracotta));}

  /* ---------- landing ---------- */
  .nav-top{display:flex;align-items:center;justify-content:space-between;padding:22px 44px;}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--ink);}
  .logo .mark{width:34px;height:34px;}
  .nav-actions{display:flex;gap:10px;align-items:center;}
  .link-btn{background:none;border:none;font-family:var(--font-display);font-weight:600;font-size:14.5px;color:var(--ink);}

  .hero{padding:20px 44px 64px;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;}
  .hero-eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--terracotta-soft);color:var(--terracotta);padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;font-family:var(--font-display);margin-bottom:18px;}
  .hero h1{font-size:46px;line-height:1.08;margin:0 0 18px;letter-spacing:-.01em;}
  .hero h1 em{font-style:normal;color:var(--terracotta);}
  .hero p{font-size:17px;color:var(--ink-soft);line-height:1.55;max-width:460px;margin:0 0 28px;}
  .hero-ctas{display:flex;gap:14px;}
  .hero-art{position:relative;aspect-ratio:1/1;}
  .welcome-word{position:absolute;font-family:var(--font-display);font-weight:800;line-height:1;white-space:nowrap;}
  .welcome-word .lang{display:block;font-family:var(--font-body);font-weight:600;font-size:11.5px;color:var(--ink-faint);margin-top:6px;white-space:nowrap;}
  .welcome-word.featured{font-size:40px;}
  .welcome-word:not(.featured){font-size:24px;}
  .lang-pill-row{display:flex;flex-wrap:wrap;gap:9px;margin-top:26px;}
  .lang-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-family:var(--font-display);font-weight:700;font-size:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink-soft);}
  .lang-pill.live{border-color:var(--gold-deep);background:var(--gold-soft);color:var(--gold-deep);}
  .lang-pill.more{border-style:dashed;color:var(--ink-faint);background:transparent;}

  .features{padding:10px 44px 70px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  .feature-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);padding:26px;}
  .feature-card .icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px;}
  .feature-card h3{font-family:var(--font-display);font-size:18px;margin:0 0 6px;}
  .feature-card p{color:var(--ink-soft);font-size:14px;line-height:1.5;margin:0;}

  /* ---------- auth / onboarding shell ---------- */
  .onboard-wrap{min-height:640px;display:grid;grid-template-columns:.9fr 1.1fr;}
  .onboard-side{background:var(--indigo);color:#EFE9FB;padding:44px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
  .onboard-side .mark{width:30px;height:30px;}
  .onboard-side h2{font-family:var(--font-serif);font-size:26px;line-height:1.35;font-weight:500;max-width:320px;}
  .onboard-side .step-list{display:flex;flex-direction:column;gap:14px;margin-top:auto;}
  .step-item{display:flex;align-items:center;gap:12px;font-size:13.5px;color:#B7ACE0;}
  .step-item.done{color:#fff;}
  .step-item .dot{width:22px;height:22px;border-radius:50%;border:2px solid #574C93;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
  .step-item.done .dot{background:var(--gold);border-color:var(--gold);color:#241A12;font-weight:800;}
  .step-item.active .dot{border-color:var(--gold);color:var(--gold);}

  .onboard-main{padding:56px 60px;display:flex;flex-direction:column;justify-content:center;}
  .onboard-main .kicker{font-family:var(--font-display);color:var(--terracotta);font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;}
  .onboard-main h1{font-size:30px;margin:0 0 8px;}
  .onboard-main .sub{color:var(--ink-soft);margin:0 0 32px;font-size:14.5px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--ink);}
  .field input{width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);font-size:14.5px;background:#fff;}
  .field input:focus{border-color:var(--indigo);}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px;}
  .role-card{border:2px solid var(--line);border-radius:var(--radius-md);padding:20px;text-align:left;background:#fff;}
  .role-card.selected{border-color:var(--indigo);background:var(--indigo-soft);}
  .role-card .emoji{font-size:26px;margin-bottom:8px;display:block;}
  .role-card b{font-family:var(--font-display);display:block;font-size:15px;margin-bottom:3px;}
  .role-card span{font-size:12.5px;color:var(--ink-soft);}

  .avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:8px;}
  .segmented{display:flex;gap:10px;}
  .segmented button{flex:1;padding:13px 10px;border-radius:12px;border:2px solid var(--line);background:#fff;font-family:var(--font-display);font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px;}
  .segmented button.selected{border-color:var(--indigo);background:var(--indigo-soft);color:var(--indigo);}
  .avatar-opt{aspect-ratio:1;border-radius:16px;border:2px solid var(--line);background:var(--bg-soft);font-size:26px;display:flex;align-items:center;justify-content:center;}
  .avatar-opt.selected{border-color:var(--gold-deep);background:var(--gold-soft);}

  .card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .choice-card{border:2px solid var(--line);border-radius:var(--radius-md);padding:22px 18px;text-align:left;background:#fff;position:relative;}
  .choice-card.selected{border-color:var(--terracotta);background:var(--terracotta-soft);}
  .choice-card .big{font-size:30px;margin-bottom:10px;display:block;}
  .choice-card b{font-family:var(--font-display);font-size:15px;}
  .choice-card .check{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;background:var(--terracotta);color:#fff;display:none;align-items:center;justify-content:center;font-size:12px;}
  .choice-card.selected .check{display:flex;}
  .choice-card.tag{opacity:.5;}
  .level-card{border:2px solid var(--line);border-radius:var(--radius-md);padding:20px 22px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;background:#fff;}
  .level-card.selected{border-color:var(--green);background:var(--green-soft);}
  .level-card b{font-family:var(--font-display);font-size:15.5px;display:block;}
  .level-card span{color:var(--ink-soft);font-size:13px;}

  /* ---------- kid app shell ---------- */
  .kid-shell{display:flex;min-height:680px;}
  .kid-sidebar{width:220px;flex-shrink:0;background:var(--indigo);color:#fff;padding:26px 18px;display:flex;flex-direction:column;}
  .kid-sidebar .logo{color:#fff;margin-bottom:30px;padding-left:6px;}
  .kid-nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-family:var(--font-display);font-weight:600;font-size:14.5px;color:#C9C0EA;margin-bottom:4px;background:none;border:none;width:100%;text-align:left;}
  .kid-nav-item .ic{font-size:18px;width:22px;text-align:center;}
  .kid-nav-item.active{background:rgba(255,255,255,.12);color:#fff;}
  .kid-sidebar .child-chip{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:rgba(255,255,255,.08);}
  .kid-sidebar .child-chip .av{width:36px;height:36px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:18px;}
  .kid-sidebar .child-chip small{display:block;color:#B7ACE0;font-size:11px;}

  .kid-main{flex:1;padding:32px 38px;background:var(--bg);min-width:0;}
  .kid-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;}
  .kid-topbar h1{font-size:26px;margin:0;}
  .kid-stats{display:flex;gap:10px;}
  .stat-chip{display:flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--line);padding:8px 14px;border-radius:999px;font-family:var(--font-display);font-weight:700;font-size:13.5px;}

  .dash-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;}
  @container (max-width: 900px){ .dash-grid{grid-template-columns:1fr;} .card-grid{grid-template-columns:repeat(2,1fr);} .kid-sidebar{width:76px;} .kid-sidebar .label-text{display:none;} .kid-sidebar .logo span{display:none;} .kid-sidebar .child-chip span{display:none;} }
  @container (max-width: 600px){ .kid-shell{flex-direction:column;} .kid-sidebar{width:100%;flex-direction:row;align-items:center;padding:14px 16px;} .kid-sidebar .logo{margin-bottom:0;} .kid-sidebar nav{display:flex;gap:4px;margin-left:auto;} .kid-nav-item{padding:8px 10px;} .kid-nav-item span.label-text{display:none;} .kid-sidebar .child-chip{display:none;} .kid-main{padding:20px 18px;} .hero{grid-template-columns:1fr;} .onboard-wrap{grid-template-columns:1fr;} .onboard-side{display:none;} .card-grid{grid-template-columns:1fr;} .role-grid{grid-template-columns:1fr;} .features{grid-template-columns:1fr;} .dash-grid{grid-template-columns:1fr;} }

  .big-card{background:var(--paper);border-radius:var(--radius-lg);padding:26px;box-shadow:var(--shadow-card);}
  .continue-card{background:linear-gradient(120deg, var(--indigo) 0%, #4B3E85 100%);color:#fff;border-radius:var(--radius-lg);padding:28px;position:relative;overflow:hidden;}
  .continue-card .tag{display:inline-block;background:rgba(255,255,255,.14);padding:4px 12px;border-radius:999px;font-size:11.5px;font-weight:700;font-family:var(--font-display);margin-bottom:12px;}
  .continue-card h2{font-size:24px;margin:0 0 6px;}
  .continue-card p{color:#C9C0EA;margin:0 0 18px;font-size:13.5px;}
  .continue-card .progress-track{background:rgba(255,255,255,.18);}
  .continue-card .pct{font-family:var(--font-display);font-weight:700;font-size:13px;margin:8px 0 18px;color:#EFE9FB;}

  .row-cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;}
  .mini-card{background:var(--paper);border-radius:var(--radius-md);padding:22px;box-shadow:var(--shadow-card);}
  .mini-card h3{font-family:var(--font-display);font-size:16px;margin:0 0 6px;display:flex;align-items:center;gap:8px;}
  .mini-card p{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}

  .side-card{background:var(--paper);border-radius:var(--radius-md);padding:22px;box-shadow:var(--shadow-card);margin-bottom:18px;}
  .side-card h3{font-family:var(--font-display);font-size:15.5px;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .kofi-row{display:flex;gap:12px;align-items:flex-start;}
  .kofi-av{width:44px;height:44px;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  .kofi-msg{background:var(--bg-soft);border-radius:14px;border-top-left-radius:4px;padding:10px 13px;font-size:13.5px;line-height:1.45;}

  .badge-row{display:flex;gap:12px;}
  .badge{flex:1;text-align:center;font-size:11.5px;font-weight:600;color:var(--ink-soft);}
  .badge .stamp{margin:0 auto 6px;color:var(--gold-deep);background:var(--gold-soft);}
  .badge.locked .stamp{color:var(--ink-faint);background:var(--bg-soft);border-style:dashed;}
  .badge.locked{color:var(--ink-faint);}

  /* course overview */
  .module-row{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:16px;background:var(--paper);box-shadow:var(--shadow-card);margin-bottom:12px;}
  .module-row .num{width:38px;height:38px;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;flex-shrink:0;}
  .module-row.locked .num{background:var(--bg-soft);color:var(--ink-faint);}
  .module-row.locked{opacity:.55;}
  .module-row .info{flex:1;}
  .module-row b{font-family:var(--font-display);font-size:15px;display:block;}
  .module-row .info span{font-size:12.5px;color:var(--ink-soft);}

  /* lesson */
  .lesson-shell{display:flex;flex-direction:column;min-height:640px;background:linear-gradient(180deg, var(--gold-soft), var(--bg));}
  .lesson-top{display:flex;align-items:center;gap:16px;padding:22px 36px;}
  .lesson-top .progress-track{flex:1;}
  .word-card{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 36px 40px;}
  .word-card-inner{background:#fff;border-radius:32px;box-shadow:var(--shadow-pop);padding:44px;max-width:520px;width:100%;text-align:center;}
  .word-illustration{font-size:64px;margin-bottom:18px;}
  .word-twi{font-family:var(--font-display);font-size:44px;font-weight:800;color:var(--terracotta);margin:0 0 8px;}
  .word-meaning{font-size:16px;color:var(--ink-soft);margin:0 0 18px;}
  .word-phrase{background:var(--bg-soft);border-radius:14px;padding:12px 16px;font-size:14px;color:var(--ink);margin-bottom:24px;}
  .word-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .icon-btn{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;}
  .icon-btn.recording{border-color:var(--terracotta);background:var(--terracotta-soft);}
  .lesson-bottom{padding:18px 36px 30px;display:flex;justify-content:center;}
  .praise-toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-family:var(--font-display);font-weight:700;font-size:14px;box-shadow:var(--shadow-pop);z-index:80;}

  /* exercise / quiz */
  .exercise-shell{max-width:560px;margin:0 auto;padding:50px 24px;text-align:center;}
  .exercise-shell .qcount{font-family:var(--font-display);color:var(--ink-soft);font-weight:700;font-size:13px;margin-bottom:14px;}
  .exercise-shell h2{font-size:24px;margin:0 0 30px;}
  .choice-list{display:flex;flex-direction:column;gap:12px;}
  .choice-opt{padding:16px 20px;border-radius:16px;border:2px solid var(--line);background:#fff;font-size:15.5px;font-family:var(--font-display);font-weight:600;text-align:left;}
  .choice-opt.correct{border-color:var(--green);background:var(--green-soft);}
  .choice-opt.wrong{border-color:var(--terracotta);background:var(--terracotta-soft);}
  .result-banner{margin-top:22px;font-family:var(--font-display);font-weight:700;font-size:17px;}
  .result-banner.good{color:var(--green);}
  .result-banner.bad{color:var(--terracotta);}
  .xp-float{font-size:13px;color:var(--gold-deep);font-weight:700;}

  /* mini game */
  .game-shell{max-width:640px;margin:0 auto;padding:40px 24px;text-align:center;}
  .match-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px;}

  const sel = document.getElementById('jumpNav');

  document.getElementById('jumpNav').value = state.screen;

function pathKey(p){ return `${p.country}|${p.type}|${p.label}`; }
function hasPath(country,type,label){
  return state.learningPaths.some(p=>p.country===country && p.type===type && p.label===label);
}
function toggleLearningPath(country,flag,type,label){
  const key = `${country}|${type}|${label}`;
  const idx = state.learningPaths.findIndex(p=>pathKey(p)===key);
  if(idx>=0){
    if(state.learningPaths.length>1) state.learningPaths.splice(idx,1);
  }else{
    state.learningPaths.push({country,flag,type,label});
  }

  const lang = state.learningPaths.find(p=>p.type==='language');
  const culture = state.learningPaths.find(p=>p.type==='culture');
  if(lang) state.language = lang.label;
  if(culture) state.culture = culture.country;
  render();
}
function removeLearningPath(key){
  const idx = state.learningPaths.findIndex(p=>pathKey(p)===key);
  if(idx>=0 && state.learningPaths.length>1) state.learningPaths.splice(idx,1);
  render();
}

const gamePairsLeft = ['Akwaaba','Maakye','Medaase'];
const gamePairsRight = ['Thank you','Welcome','Good morning'];
const gameKey = {'Akwaaba':'Welcome','Maakye':'Good morning','Medaase':'Thank you'};
function renderMinigame(){
  const done = state.gameMatched.length === gamePairsLeft.length;
  return `<div class="game-shell">
    <div class="qcount" style="font-family:var(--font-display);color:var(--ink-soft);font-weight:700;font-size:13px;">MINI-GAME</div>

        <h2 class="h-display">Amazing!</h2>
        <p style="color:var(--ink-soft);">You matched all the words.</p>
        <div class="result-banner good">+30 XP</div>
        <button class="btn btn-primary" style="margin-top:22px;" onclick="go('quiz')">Continue to Quiz</button>
      </div>
    ` : `
      <div class="match-cols">
        <div>
          ${gamePairsLeft.map(w=>`<button class="match-tile ${state.gameMatched.includes(w)?'matched':state.gameSelected===w?'selected':''}" style="margin-bottom:10px;width:100%;" ${state.gameMatched.includes(w)?'disabled':''} onclick="selectGame('${w}')">${w}</button>`).join('')}
        </div>
        <div>
          ${gamePairsRight.map(m=>`<button class="match-tile ${state.gameMatched.includes(gameKey[Object.keys(gameKey).find(k=>gameKey[k]===m)])?'matched':''}" style="margin-bottom:10px;width:100%;" onclick="matchGame('${m}')">${m}</button>`).join('')}
        </div>
      </div>
    `}
  </div>`;
}
function selectGame(w){ state.gameSelected = w; render(); }
function matchGame(m){
  if(!state.gameSelected) return;
  if(gameKey[state.gameSelected] === m){
    state.gameMatched.push(state.gameSelected);
    if(state.gameMatched.length === gamePairsLeft.length) state.xp += 30;
  }
  state.gameSelected = null;
  render();
}
